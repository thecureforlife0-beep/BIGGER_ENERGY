<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d100d" />
    <title>Offline — The Method</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d100d; color: #f3f6ee; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      h1 { letter-spacing: -.05em; }
      p { color: #a7b0a2; line-height: 1.6; }
      a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; margin-top: 16px; padding: 0 24px; border-radius: 999px; background: #8bcf22; color: #162300; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>Reconnect to the internet to open your lesson. Private video is not stored for offline playback.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
